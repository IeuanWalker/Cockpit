name: Release (Windows)

# Required repository secrets for the MSIX build:
# WINDOWS_CERTIFICATE_BASE64 - base64-encoded PFX with subject CN=Ieuan Walker
# WINDOWS_CERTIFICATE_PASSWORD - password for the PFX

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore MAUI workloads
        run: dotnet workload restore

      - name: Extract version from tag
        id: version
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          Add-Content $env:GITHUB_OUTPUT "VERSION=$version"

      - name: Publish unpackaged Windows app
        run: >
          dotnet publish src/Cockpit/Cockpit.csproj
          --framework net10.0-windows10.0.19041.0
          --configuration Release
          -p:WindowsPackageType=None
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.VERSION }}
          -p:ApplicationVersion=${{ github.run_number }}
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./publish/windows

      - name: Build portable executable
        shell: pwsh
        run: |
          dotnet publish src/Cockpit/Cockpit.csproj `
            --framework net10.0-windows10.0.19041.0 `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.VERSION }} `
            -p:ApplicationVersion=${{ github.run_number }} `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            --output ./publish/portable
          Copy-Item ./publish/portable/Cockpit.exe ./Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Portable.exe

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build legacy NSIS installer
        run: |
          $sourcePath = "${{ github.workspace }}\publish\windows"
          $version = "${{ steps.version.outputs.VERSION }}"
          $outputPath = "${{ github.workspace }}\Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Setup.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPP_VERSION="$version" /DSOURCE_PATH="$sourcePath" /DOUTPUT_PATH="$outputPath" .github/installers/windows.nsi

      - name: Import MSIX signing certificate
        id: certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "The WINDOWS_CERTIFICATE_BASE64 repository secret is required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "Cockpit.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          Add-Content $env:GITHUB_OUTPUT "path=$certificatePath"

      - name: Build signed MSIX installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msixBuildDir = "${{ github.workspace }}\publish\msix"
          dotnet publish src/Cockpit/Cockpit.csproj `
            --framework net10.0-windows10.0.19041.0 `
            --configuration Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:PackageCertificateKeyFile="${{ steps.certificate.outputs.path }}" `
            -p:PackageCertificatePassword="$env:WINDOWS_CERTIFICATE_PASSWORD" `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.VERSION }} `
            -p:ApplicationVersion=${{ github.run_number }} `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -p:AppxPackageDir="$msixBuildDir\"

          $packages = @(Get-ChildItem -Path $msixBuildDir -Filter *.msix -File -Recurse)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSIX package, but found: $($packages.FullName -join ', ')"
          }
          Copy-Item $packages[0].FullName "./Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Installer.msix"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ steps.certificate.outputs.path }}" -Force -ErrorAction SilentlyContinue

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Portable.exe
            Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Setup.exe
            Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Installer.msix
          generate_release_notes: false
