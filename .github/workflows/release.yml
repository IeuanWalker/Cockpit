name: Release (Windows)

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore MAUI workloads
        run: dotnet workload restore

      - name: Extract version from tag
        id: version
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          Add-Content $env:GITHUB_OUTPUT "VERSION=$version"

      - name: Publish Windows app
        run: >
          dotnet publish src/Cockpit/Cockpit.csproj
          --framework net10.0-windows10.0.19041.0
          --configuration Release
          -p:RuntimeIdentifierOverride=win-x64
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.VERSION }}
          -p:ApplicationVersion=${{ github.run_number }}
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./publish/windows

      - name: Create release artifacts
        run: |
          $publishedFiles = @(Get-ChildItem -Path ./publish/windows -File -Recurse)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -ne "Cockpit.exe") {
            throw "Expected a single self-contained Cockpit.exe, but found: $($publishedFiles.FullName -join ', ')"
          }
          $outputExe = "./Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Setup.exe"
          Copy-Item $publishedFiles[0].FullName $outputExe
          Compress-Archive -Path $outputExe -DestinationPath ./Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}.zip
            Cockpit-windows-x64-${{ steps.version.outputs.VERSION }}-Setup.exe
          generate_release_notes: false
